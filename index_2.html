<!DOCTYPE html>
<html lang="es" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor M3U8 Ultra Minimalista</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080b11',
                        accent: '#6366f1',
                        accentHover: '#4f46e5'
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Modern Typography Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #080b11;
        }

        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Dropdown Glassmorphism */
        .glass-dropdown {
            background: rgba(10, 15, 28, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Glow animation */
        @keyframes subtleGlow {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(1.05); }
        }
        .glow-element {
            animation: subtleGlow 8s infinite ease-in-out;
        }

        /* Custom Input Range Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
            transition: transform 0.15s ease-in-out;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full w-full flex items-center justify-center p-4 sm:p-8 overflow-hidden select-none">

    <!-- Ambient Glowing Background Circles -->
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-indigo-600/20 rounded-full blur-[140px] pointer-events-none glow-element"></div>
    <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[450px] h-[450px] bg-purple-600/15 rounded-full blur-[120px] pointer-events-none glow-element" style="animation-delay: -4s;"></div>

    <!-- Main Ultra-Minimalist Player Container -->
    <main class="w-full max-w-5xl aspect-video relative rounded-2xl sm:rounded-3xl overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)] border border-white/10 group bg-black" id="playerContainer">
        
        <!-- Video Element -->
        <video id="videoElement" class="w-full h-full object-contain cursor-pointer" playsinline></video>

        <!-- Loading Spinner Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-black/60 backdrop-blur-md flex flex-col items-center justify-center space-y-4 transition-opacity duration-300 pointer-events-none">
            <div class="w-12 h-12 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
            <span class="text-xs font-semibold tracking-widest text-indigo-300 uppercase">Cargando Stream...</span>
        </div>

        <!-- Error Overlay -->
        <div id="errorOverlay" class="absolute inset-0 bg-black/90 backdrop-blur-lg flex flex-col items-center justify-center p-6 text-center transition-opacity duration-300 hidden z-50">
            <div class="w-16 h-16 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center mb-4">
                <i data-lucide="alert-circle" class="w-8 h-8 text-rose-500"></i>
            </div>
            <h3 class="text-lg font-semibold text-white mb-2">Error de Transmisión</h3>
            <p id="errorMessage" class="text-xs text-gray-400 max-w-md mb-6">No se pudo cargar el stream HLS. Comprueba tu conexión o verifica la URL.</p>
            <button id="retryBtn" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition-all cursor-pointer shadow-lg shadow-indigo-600/30">
                Reintentar
            </button>
        </div>

        <!-- Central Animated Touch Play/Pause Badge -->
        <div id="centerPlayIndicator" class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 z-20">
            <div id="centerPlayIconBg" class="w-20 h-20 rounded-full glass-panel flex items-center justify-center text-white scale-75 transition-transform duration-300 shadow-2xl">
                <i data-lucide="play" class="w-10 h-10 fill-white ml-1"></i>
            </div>
        </div>

        <!-- Custom Controls Overlay -->
        <div id="controlsBar" class="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/95 via-black/60 to-transparent pt-16 pb-4 px-4 sm:px-6 flex flex-col justify-end transition-opacity duration-500 z-30">
            
            <!-- Progress / Seek Bar -->
            <div class="relative w-full h-1.5 bg-white/20 rounded-full mb-4 cursor-pointer group/progress flex items-center" id="progressBarContainer">
                <div id="bufferBar" class="absolute h-full bg-white/30 rounded-full w-0 pointer-events-none"></div>
                <div id="playedBar" class="absolute h-full bg-indigo-500 rounded-full w-0 pointer-events-none shadow-[0_0_12px_rgba(99,102,241,0.8)]"></div>
                <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1" class="absolute inset-0 w-full opacity-0 cursor-pointer">
                <div id="progressThumb" class="absolute w-3.5 h-3.5 bg-white rounded-full shadow-lg scale-0 group-hover/progress:scale-100 transition-transform pointer-events-none -ml-1.5"></div>
            </div>

            <!-- Bottom Controls Actions Row -->
            <div class="flex items-center justify-between">
                
                <!-- Left Action Controls -->
                <div class="flex items-center space-x-3 sm:space-x-5">
                    <!-- Play/Pause Button -->
                    <button id="playPauseBtn" class="p-2 text-white hover:text-indigo-400 transition-colors cursor-pointer focus:outline-none" title="Reproducir / Pausa">
                        <i data-lucide="play" class="w-6 h-6 fill-white" id="playPauseIcon"></i>
                    </button>

                    <!-- Volume & Slider Control -->
                    <div class="flex items-center space-x-2 group/volume relative">
                        <button id="muteBtn" class="p-2 text-white hover:text-indigo-400 transition-colors cursor-pointer focus:outline-none" title="Silenciar">
                            <i data-lucide="volume-2" class="w-5 h-5" id="volumeIcon"></i>
                        </button>
                        <div class="w-0 overflow-hidden group-hover/volume:w-20 transition-all duration-300 flex items-center">
                            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" class="w-16 h-1 bg-white/30 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <!-- Time & Status Indicator -->
                    <div class="text-xs font-medium text-gray-300 flex items-center space-x-1.5 select-none font-mono">
                        <span id="currentTime">00:00</span>
                        <span class="text-gray-500">/</span>
                        <span id="durationTime" class="text-gray-400">00:00</span>
                    </div>
                </div>

                <!-- Right Action Controls -->
                <div class="flex items-center space-x-2 sm:space-x-4">
                    
                    <!-- Live Badge Indicator -->
                    <div id="liveBadge" class="hidden items-center space-x-1.5 px-3 py-1 rounded-full bg-rose-500/20 border border-rose-500/30 text-rose-400 text-[11px] font-bold tracking-wider">
                        <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                        <span>EN VIVO</span>
                    </div>

                    <!-- Quality / HLS Menu Dropdown -->
                    <div class="relative">
                        <button id="qualityBtn" class="px-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-semibold text-white transition-all flex items-center space-x-1.5 cursor-pointer backdrop-blur-md border border-white/10">
                            <i data-lucide="settings" class="w-3.5 h-3.5 text-indigo-400"></i>
                            <span id="currentQualityLabel">Auto</span>
                        </button>
                        
                        <!-- Dropdown Menu -->
                        <div id="qualityMenu" class="absolute bottom-full right-0 mb-3 w-40 glass-dropdown rounded-2xl shadow-2xl py-2 hidden flex-col z-50 border border-white/10 text-xs">
                            <div class="px-3 py-1 text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-white/10 mb-1">Calidad de Video</div>
                            <div id="qualityOptionsList" class="max-h-48 overflow-y-auto">
                                <!-- Dynamically injected quality options -->
                            </div>
                        </div>
                    </div>

                    <!-- Picture in Picture -->
                    <button id="pipBtn" class="p-2 text-white hover:text-indigo-400 transition-colors cursor-pointer hidden sm:block focus:outline-none" title="Picture-in-Picture">
                        <i data-lucide="pip" class="w-5 h-5"></i>
                    </button>

                    <!-- Fullscreen Toggle -->
                    <button id="fullscreenBtn" class="p-2 text-white hover:text-indigo-400 transition-colors cursor-pointer focus:outline-none" title="Pantalla Completa">
                        <i data-lucide="maximize" class="w-5 h-5" id="fullscreenIcon"></i>
                    </button>
                </div>

            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Render Lucide Icons
            lucide.createIcons();

            // DOM Elements
            const playerContainer = document.getElementById('playerContainer');
            const video = document.getElementById('videoElement');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorOverlay = document.getElementById('errorOverlay');
            const errorMessage = document.getElementById('errorMessage');
            const retryBtn = document.getElementById('retryBtn');
            const controlsBar = document.getElementById('controlsBar');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const playPauseIcon = document.getElementById('playPauseIcon');
            const muteBtn = document.getElementById('muteBtn');
            const volumeIcon = document.getElementById('volumeIcon');
            const volumeSlider = document.getElementById('volumeSlider');
            const currentTimeEl = document.getElementById('currentTime');
            const durationTimeEl = document.getElementById('durationTime');
            const seekSlider = document.getElementById('seekSlider');
            const playedBar = document.getElementById('playedBar');
            const bufferBar = document.getElementById('bufferBar');
            const liveBadge = document.getElementById('liveBadge');
            const qualityBtn = document.getElementById('qualityBtn');
            const qualityMenu = document.getElementById('qualityMenu');
            const qualityOptionsList = document.getElementById('qualityOptionsList');
            const currentQualityLabel = document.getElementById('currentQualityLabel');
            const pipBtn = document.getElementById('pipBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const fullscreenIcon = document.getElementById('fullscreenIcon');
            const centerPlayIndicator = document.getElementById('centerPlayIndicator');
            const centerPlayIconBg = document.getElementById('centerPlayIconBg');

            // Preloaded M3U8 Stream URL
            const PRELOADED_M3U8_URL = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

            let hls = null;
            let hideControlsTimeout = null;

            // Initialize Player with Preloaded Stream
            initHlsPlayer(PRELOADED_M3U8_URL);

            function initHlsPlayer(url) {
                errorOverlay.classList.add('hidden');
                loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');

                if (hls) {
                    hls.destroy();
                    hls = null;
                }

                if (Hls.isSupported()) {
                    hls = new Hls({
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                    });
                    hls.loadSource(url);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                        setupQualityMenu(hls.levels);
                        video.play().catch(e => console.log("Autoplay prevented:", e));
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                            switch (data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    showError("Error de red: No se pudo conectar con el flujo M3U8.");
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    showError("Error de reproducción: Formato de video incompatible.");
                                    try { hls.recoverMediaError(); } catch (e) {}
                                    break;
                                default:
                                    showError("Error fatal al cargar la transmisión.");
                                    hls.destroy();
                                    break;
                            }
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                        video.play().catch(e => console.log("Autoplay prevented:", e));
                    });
                    video.addEventListener('error', () => {
                        loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                        showError("Error al reproducir el flujo HLS.");
                    });
                } else {
                    loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
                    showError("Navegador incompatible con HLS.");
                }
            }

            function showError(msg) {
                errorMessage.textContent = msg;
                errorOverlay.classList.remove('hidden');
            }

            retryBtn.addEventListener('click', () => {
                initHlsPlayer(PRELOADED_M3U8_URL);
            });

            // Quality Options Menu
            function setupQualityMenu(levels) {
                qualityOptionsList.innerHTML = '';
                if (!levels || levels.length <= 1) {
                    qualityBtn.classList.add('hidden');
                    return;
                }
                qualityBtn.classList.remove('hidden');

                // Auto Quality
                const autoOpt = document.createElement('div');
                autoOpt.className = 'px-3 py-2 hover:bg-white/10 cursor-pointer text-white flex items-center justify-between transition-colors';
                autoOpt.innerHTML = `<span>Automático</span> <span class="text-[10px] text-indigo-400 font-bold">AUTO</span>`;
                autoOpt.onclick = () => {
                    hls.currentLevel = -1;
                    currentQualityLabel.textContent = 'Auto';
                    qualityMenu.classList.add('hidden');
                };
                qualityOptionsList.appendChild(autoOpt);

                // Manual Quality Levels
                levels.forEach((level, index) => {
                    const opt = document.createElement('div');
                    opt.className = 'px-3 py-2 hover:bg-white/10 cursor-pointer text-gray-300 hover:text-white flex items-center justify-between transition-colors';
                    const resName = level.height ? level.height + 'p' : `Opción ${index + 1}`;
                    const bitrate = Math.round(level.bitrate / 1000);
                    opt.innerHTML = `<span>${resName}</span> <span class="text-[10px] text-gray-500">${bitrate} kbps</span>`;
                    opt.onclick = () => {
                        hls.currentLevel = index;
                        currentQualityLabel.textContent = resName;
                        qualityMenu.classList.add('hidden');
                    };
                    qualityOptionsList.appendChild(opt);
                });
            }

            qualityBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                qualityMenu.classList.toggle('hidden');
            });

            document.addEventListener('click', () => {
                qualityMenu.classList.add('hidden');
            });

            // Play / Pause Logic
            function togglePlay() {
                if (video.paused) {
                    video.play();
                    showCenterIndicator('play');
                } else {
                    video.pause();
                    showCenterIndicator('pause');
                }
            }

            function showCenterIndicator(type) {
                centerPlayIconBg.innerHTML = type === 'play' 
                    ? '<i data-lucide="play" class="w-10 h-10 fill-white ml-1"></i>' 
                    : '<i data-lucide="pause" class="w-10 h-10 fill-white"></i>';
                lucide.createIcons();
                centerPlayIndicator.classList.remove('opacity-0');
                centerPlayIconBg.classList.remove('scale-75');
                centerPlayIconBg.classList.add('scale-100');
                setTimeout(() => {
                    centerPlayIndicator.classList.add('opacity-0');
                    centerPlayIconBg.classList.remove('scale-100');
                    centerPlayIconBg.classList.add('scale-75');
                }, 400);
            }

            playPauseBtn.addEventListener('click', togglePlay);
            video.addEventListener('click', togglePlay);

            video.addEventListener('play', () => {
                playPauseIcon.setAttribute('data-lucide', 'pause');
                lucide.createIcons();
                resetControlsTimeout();
            });

            video.addEventListener('pause', () => {
                playPauseIcon.setAttribute('data-lucide', 'play');
                lucide.createIcons();
                showControls();
            });

            // Volume & Mute Controls
            muteBtn.addEventListener('click', () => {
                video.muted = !video.muted;
                updateVolumeUI();
            });

            volumeSlider.addEventListener('input', (e) => {
                video.volume = e.target.value;
                video.muted = (video.volume == 0);
                updateVolumeUI();
            });

            function updateVolumeUI() {
                volumeSlider.value = video.muted ? 0 : video.volume;
                if (video.muted || video.volume == 0) {
                    volumeIcon.setAttribute('data-lucide', 'volume-x');
                } else if (video.volume < 0.5) {
                    volumeIcon.setAttribute('data-lucide', 'volume-1');
                } else {
                    volumeIcon.setAttribute('data-lucide', 'volume-2');
                }
                lucide.createIcons();
            }

            // Time & Buffer Progress Updates
            video.addEventListener('timeupdate', () => {
                if (!isNaN(video.duration) && video.duration > 0) {
                    const percent = (video.currentTime / video.duration) * 100;
                    seekSlider.value = percent;
                    playedBar.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(video.currentTime);
                    durationTimeEl.textContent = formatTime(video.duration);
                    liveBadge.classList.add('hidden');
                } else {
                    currentTimeEl.textContent = formatTime(video.currentTime);
                    durationTimeEl.textContent = "LIVE";
                    liveBadge.classList.remove('hidden');
                    liveBadge.classList.add('flex');
                }

                if (video.buffered.length > 0) {
                    const bufferedEnd = video.buffered.end(video.buffered.length - 1);
                    if (!isNaN(video.duration) && video.duration > 0) {
                        const bufferPercent = (bufferedEnd / video.duration) * 100;
                        bufferBar.style.width = bufferPercent + '%';
                    }
                }
            });

            seekSlider.addEventListener('input', (e) => {
                if (!isNaN(video.duration) && video.duration > 0) {
                    const seekTime = (e.target.value / 100) * video.duration;
                    video.currentTime = seekTime;
                }
            });

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // Picture in Picture Toggle
            pipBtn.addEventListener('click', async () => {
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                    } else if (document.pictureInPictureEnabled) {
                        await video.requestPictureInPicture();
                    }
                } catch (e) {
                    console.error("PiP error:", e);
                }
            });

            // Fullscreen Toggle
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    playerContainer.requestFullscreen().catch(err => console.error(err));
                    fullscreenIcon.setAttribute('data-lucide', 'minimize');
                } else {
                    document.exitFullscreen();
                    fullscreenIcon.setAttribute('data-lucide', 'maximize');
                }
                lucide.createIcons();
            });

            // Auto-hide Controls Logic
            function showControls() {
                controlsBar.classList.remove('opacity-0');
                playerContainer.style.cursor = 'default';
                resetControlsTimeout();
            }

            function hideControls() {
                if (!video.paused && qualityMenu.classList.contains('hidden')) {
                    controlsBar.classList.add('opacity-0');
                    playerContainer.style.cursor = 'none';
                }
            }

            function resetControlsTimeout() {
                clearTimeout(hideControlsTimeout);
                if (!video.paused) {
                    hideControlsTimeout = setTimeout(hideControls, 2500);
                }
            }

            playerContainer.addEventListener('mousemove', showControls);
            playerContainer.addEventListener('mouseleave', () => {
                if (!video.paused) hideControls();
            });
        });
    </script>
</body>
</html>
